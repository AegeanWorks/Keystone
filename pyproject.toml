[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-engine"
version = "0.32.0"
description = "A game-agnostic 3D engine core with an OpenGL 3.3 renderer."
requires-python = ">=3.10"
dependencies = ["numpy==2.5.3", "PyOpenGL==3.1.10", "glfw==2.11.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["keystone*"]

[tool.setuptools.package-data]
keystone = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# Vec3/Quat are frozen and immutable, so sharing one default instance is safe and
# cheaper than a default_factory. Self needs Python 3.11, while this project supports 3.10.
ignore = ["RUF009", "PYI034"]
