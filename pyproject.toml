[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-engine"
version = "0.1.0"
description = "A performance-first 3D game engine with an OpenGL 3.3 renderer."
requires-python = ">=3.10"
dependencies = ["numpy==2.5.3", "PyOpenGL==3.1.10", "glfw==2.11.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["keystone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
