<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keystone Web Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brandline">
      <span class="brand">KEYSTONE</span>
      <span id="game" class="muted">loading</span>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">connecting</div>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card">
        <h2>Simulation</h2>
        <div class="row">
          <label for="frames">Frames</label>
          <input id="frames" type="number" min="0" max="100000" step="1" value="60">
        </div>
        <label class="stack" for="actions">Actions JSON</label>
        <textarea id="actions" spellcheck="false" rows="6">[]</textarea>
        <div class="buttons">
          <button id="step" type="button" title="Rebuilds the scene, then advances one frame">Reset + Step 1</button>
          <button id="run" type="button">Run 60</button>
          <button id="simulate" type="button" class="primary">Simulate</button>
        </div>
        <p class="hint">Actions use the same JSON shape as <code>--simulate --actions</code>.</p>
      </section>

      <section class="card editor-card">
        <h2>Scene editor</h2>
        <label class="stack" for="hierarchy">Hierarchy</label>
        <select id="hierarchy" size="8" aria-label="Scene hierarchy"></select>
        <div class="buttons">
          <button id="play-start" type="button">Play</button>
          <button id="play-step" type="button">Step</button>
          <button id="play-stop" type="button">Stop</button>
        </div>
        <div id="play-state" class="hint">Stopped</div>
        <div class="field-grid">
          <label>Node name <input id="node-name" type="text" value="node"></label>
          <label>Parent
            <select id="node-parent" aria-label="Node parent">
              <option value="root">Scene root</option>
            </select>
          </label>
        </div>
        <div class="buttons">
          <button id="node-create" type="button">Create node</button>
          <button id="node-duplicate" type="button">Duplicate</button>
          <button id="node-delete" type="button">Delete</button>
          <button id="node-reparent" type="button">Reparent</button>
        </div>
        <div class="buttons">
          <button id="editor-undo" type="button">Undo</button>
          <button id="editor-redo" type="button">Redo</button>
        </div>
        <div class="field-grid">
          <label>Scene name <input id="scene-name" type="text" value="scene"></label>
        </div>
        <div class="buttons">
          <button id="scene-save" type="button">Save scene</button>
          <button id="scene-load" type="button">Load scene</button>
        </div>
        <div class="field-grid">
          <label>Prefab name <input id="prefab-name" type="text" value="hero"></label>
          <label>Instance prefix <input id="prefab-instance" type="text" placeholder="optional"></label>
        </div>
        <div class="buttons">
          <button id="prefab-save" type="button">Save prefab</button>
          <button id="prefab-insert" type="button">Insert prefab</button>
        </div>
        <label class="stack" for="position">Position x/y/z</label>
        <input id="position" type="text" value="0, 0, 0">
        <label class="stack" for="rotation">Rotation x/y/z/w</label>
        <input id="rotation" type="text" value="0, 0, 0, 1">
        <label class="stack" for="scale">Scale x/y/z</label>
        <input id="scale" type="text" value="1, 1, 1">
        <div class="buttons">
          <button id="transform-apply" type="button" class="primary">Apply transform</button>
          <button id="editor-refresh" type="button">Refresh editor</button>
        </div>
        <div class="field-grid">
          <label>Mesh asset <select id="mesh-asset"></select></label>
          <label>Material asset <select id="material-asset"></select></label>
        </div>
        <div class="buttons">
          <button id="assign-asset" type="button">Assign assets</button>
        </div>
        <div class="field-grid">
          <label>Component type <select id="component-type"></select></label>
        </div>
        <label class="stack" for="component-data">Component data JSON</label>
        <textarea id="component-data" spellcheck="false" rows="4">{}</textarea>
        <div class="buttons">
          <button id="component-set" type="button">Set component</button>
          <button id="component-remove" type="button">Remove component</button>
        </div>
        <div id="editor-state" class="hint">Select a node to edit.</div>
      </section>

      <section class="card">
        <h2>Scene</h2>
        <div id="summary" class="summary">No scene loaded.</div>
        <button id="refresh" type="button">Refresh scene</button>
      </section>

      <section class="card output-card">
        <h2>JSON</h2>
        <pre id="output" tabindex="0">Waiting for the engine.</pre>
      </section>
    </aside>

    <section class="viewport" aria-label="WebGL scene viewer">
      <canvas id="canvas"></canvas>
      <div id="viewer-status" class="viewer-status">WebGL2 viewer</div>
      <div id="hud" class="hud"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
