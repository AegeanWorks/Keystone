  <text x="640" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">A small, game-agnostic 3D engine core in Python:</text><text x="640" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">OpenGL 3.3 rendering, textured materials, scene</text><text x="640" y="504" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#F8FAFC" fill-opacity="0.72">graph, meshes and OBJ loading, fixed-step loop,</text>
