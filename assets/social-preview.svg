<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="pulse" data-layout="center">
  <title id="title">Keystone social preview</title>
  <desc id="desc">A small, game-agnostic 3D engine core in Python: OpenGL 3.3 rendering, textured materials, scene graph, meshes and OBJ loading, fixed-step loop, action input, collision primitives, deterministic replay, atomic serialization, and a human HUD/help overlay rendered with an embedded bitmap font.</desc>
  <defs>
